$kind: http-request
name: "[+] PUT /admin/settings — Superadmin"
url: "{{base_url}}/admin/settings"
method: PUT
headers:
  Authorization: Bearer {{token_superadmin}}
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: '{"settings": [{"key": "site_name", "value": "SMA Al Ghazaly"}, {"key": "site_address", "value": "Jl. Raya Garut No. 1"}]}'
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      pm.test('[HTTP] Status 200 OK', function () { pm.response.to.have.status(200); });
      pm.test('[Performa] Response Time < 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      pm.test('[Kontrak] Response memiliki message', function () { pm.expect(res).to.have.property('message').that.is.a('string'); });
      pm.test('[Bisnis] Pesan konfirmasi update settings', function () {
          pm.expect(res.message.toLowerCase()).to.match(/disimpan|berhasil|updated|saved|pengaturan/);
      });
    language: text/javascript
order: 2000
