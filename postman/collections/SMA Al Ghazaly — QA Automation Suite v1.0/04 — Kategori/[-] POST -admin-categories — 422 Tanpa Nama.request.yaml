$kind: http-request
name: "[-] POST /admin/categories — 422 Tanpa Nama"
url: "{{base_url}}/admin/categories"
method: POST
headers:
  Authorization: Bearer {{token_editor}}
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      pm.test('[HTTP] Status 422 Unprocessable', function () { pm.response.to.have.status(422); });
      pm.test('[Performa] Response Time < 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      pm.test('[Schema] Struktur 422 sesuai kontrak', function () {
          pm.expect(res).to.have.property('message');
          pm.expect(res).to.have.property('errors');
      });
      pm.test('[422] errors mengandung field validasi yang gagal', function () {
          pm.expect(Object.keys(res.errors).length).to.be.above(0);
      });
    language: text/javascript
order: 3000
