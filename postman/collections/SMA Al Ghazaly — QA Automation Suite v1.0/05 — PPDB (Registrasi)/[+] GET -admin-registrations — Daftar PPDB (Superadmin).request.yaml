$kind: http-request
name: "[+] GET /admin/registrations — Daftar PPDB (Superadmin)"
url: "{{base_url}}/admin/registrations"
method: GET
headers:
  Authorization: Bearer {{token_superadmin}}
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      pm.test('[HTTP] Status 200 OK', function () { pm.response.to.have.status(200); });
      pm.test('[Performa] Response Time < 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      pm.test('[Bisnis] data adalah array', function () { pm.expect(res.data).to.be.an('array'); });
      pm.test('[Bisnis] Terdapat minimal 2 data seeder', function () { pm.expect(res.data.length).to.be.at.least(2); });
    language: text/javascript
order: 3000
