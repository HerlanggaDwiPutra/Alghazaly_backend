$kind: http-request
name: "[+] GET /registrations/PPDB-2025-0002/status — Cek Status Seeder #2 (verified)"
url: "{{base_url}}/registrations/PPDB-2025-0002/status"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      pm.test('[HTTP] Status 200 OK', function () { pm.response.to.have.status(200); });
      pm.test('[Performa] Response Time < 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      pm.test('[Schema] Cek status pendaftaran sesuai kontrak (flat object)', function () {
          pm.expect(res).to.have.property('registration_number').that.is.a('string');
          pm.expect(res).to.have.property('full_name').that.is.a('string');
          pm.expect(res).to.have.property('status').that.is.a('string');
      });
      pm.test('[Bisnis] Nomor pendaftaran PPDB-2025-0002', function () { pm.expect(res.registration_number).to.equal('PPDB-2025-0002'); });
      pm.test('[Bisnis] Nama pendaftar Putri Aulia Rahma', function () { pm.expect(res.full_name).to.include('Putri'); });
      pm.test('[Bisnis] Status adalah verified (sesuai seeder)', function () { pm.expect(res.status).to.equal('verified'); });
    language: text/javascript
order: 2000
