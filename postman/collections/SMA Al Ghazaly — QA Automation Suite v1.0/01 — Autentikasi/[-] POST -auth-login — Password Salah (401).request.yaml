$kind: http-request
name: "[-] POST /auth/login — Password Salah (401)"
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: '{"email": "{{superadmin_email}}", "password": "password-salah-banget-123"}'
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      pm.test('[HTTP] Status 401 Unauthorized', function () { pm.response.to.have.status(401); });
      pm.test('[Performa] Response Time < 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      pm.test('[Keamanan] Response tidak mengandung token', function () { pm.expect(res).to.not.have.property('token'); });
      pm.test('[Bisnis] Response mengandung pesan error', function () { pm.expect(res).to.have.property('message').that.is.a('string'); });
    language: text/javascript
order: 3000
