$kind: http-request
name: "[-] GET /auth/me — Tanpa Auth (401)"
url: "{{base_url}}/auth/me"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      pm.test('[Keamanan] Status 401 Unauthorized', function () { pm.response.to.have.status(401); });
      pm.test('[Performa] Response Time < 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      pm.test('[Keamanan] Response memiliki field message', function () { pm.expect(res).to.have.property('message'); });
      pm.test('[Keamanan] Response tidak mengandung data user', function () { pm.expect(res).to.not.have.property('email'); });
    language: text/javascript
order: 6000
