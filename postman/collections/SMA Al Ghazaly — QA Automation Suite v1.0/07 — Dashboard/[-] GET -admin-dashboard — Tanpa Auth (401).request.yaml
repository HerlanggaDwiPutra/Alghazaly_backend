$kind: http-request
name: "[-] GET /admin/dashboard — Tanpa Auth (401)"
url: "{{base_url}}/admin/dashboard"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      var res = pm.response.json();
      pm.test('[Keamanan] Status 401 Unauthorized', function () { pm.response.to.have.status(401); });
      pm.test('[Keamanan] Tidak ada data statistik', function () { pm.expect(res).to.not.have.property('registrations'); });
    language: text/javascript
order: 2000
